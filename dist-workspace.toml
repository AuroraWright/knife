[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Start releases from the Actions tab instead of by pushing a tag
dispatch-releases = true
# Which actions to run on pull requests
pr-run-mode = "plan"
# release.yml is edited by hand (the changelog link in the release notes), so dist must not regenerate it
allow-dirty = ["ci"]
# Whether to install an updater program
install-updater = false
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["knife.ini.example"]

# build the aarch64 linux release on an aarch64 runner
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

# install additional packages when building the linux release
[dist.dependencies.apt]
libasound2-dev = '*'
"libgstreamer1.0-dev" = '*'
"libgstreamer-plugins-base1.0-dev" = '*'
libudev-dev = '*'
# GitHub's Ubuntu 22.04 runner ships libunwind-14-dev, which blocks GStreamer's
# libunwind-dev dependency unless it is requested explicitly
libunwind-dev = '*'
