# CI that builds, lints and tests the workspace on Linux, macOS and Windows for every push and pull request.
# Releases are built by release.yml (generated by dist).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: enable windows longpaths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: clippy (debug options)
        run: cargo clippy --workspace --all-targets --features knife/debug
      # the tests that need the game data skip themselves without it
      - name: test
        run: cargo test --workspace
